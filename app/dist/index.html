<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Little Days — Your photo journal</title><link rel="stylesheet" href="style.css"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 50 50%27%3E%3Crect width=%2750%27 height=%2750%27 rx=%2710%27 fill=%27%23394c38%27/%3E%3Ctext x=%2725%27 y=%2737%27 text-anchor=%27middle%27 font-size=%2738%27 fill=%27%23f7f5ee%27%3Em%3C/text%3E%3C/svg%3E"></head><body>
<header><a class="brand" href="#" aria-label="Journal home"><span class="brand-mark">j.</span><span>little days<span class="brand-sub">A PHOTO JOURNAL</span></span></a><nav><button class="overview-button" id="overview" aria-label="All entries" aria-expanded="false" aria-controls="journal-index">▦ <span>All entries</span></button><button class="small" data-new>＋ New entry</button></nav></header>
<main id="main"></main><div id="toast" role="status"></div>
<dialog id="editor"><form id="form"><div class="modal-top"><span class="eyebrow">A LITTLE OF YOUR LIFE</span><button type="button" class="icon" id="close" aria-label="Close editor">×</button></div><h2 id="editor-heading">What do you want<br>to keep?</h2><label class="field">Entry title<input id="title" maxlength="100" placeholder="e.g. My first apartment"></label><label class="field">A little introduction <span>(optional)</span><textarea id="intro" maxlength="500" rows="2" placeholder="A few words about this chapter…"></textarea></label><div class="section-line"><h3>Photos &amp; little memories</h3><span id="count">0 / 3 to get started</span></div><p class="hint">Photos, screenshots, or a voice note. Add as many as you like.</p><div id="objects"></div><label class="upload" id="upload-label"><input id="upload" type="file" multiple accept="image/*,audio/*"><span>＋</span> Add a memory<small>Images or audio · up to 20 MB each</small></label><p id="error" role="alert"></p><footer class="modal-footer"><span>◌ Only on this browser</span><button type="submit">Save entry <span>↗</span></button></footer></form></dialog>
<script src="app.js"></script></body></html>
