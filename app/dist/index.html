<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Museum of You — Keep a little of your life</title><link rel="stylesheet" href="style.css"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 50 50%27%3E%3Crect width=%2750%27 height=%2750%27 rx=%2710%27 fill=%27%23394c38%27/%3E%3Ctext x=%2725%27 y=%2737%27 text-anchor=%27middle%27 font-size=%2738%27 fill=%27%23f7f5ee%27%3Em%3C/text%3E%3C/svg%3E"></head><body>
<header><a class="brand" href="#" aria-label="Museum of You home">m<span>o</span>y<span class="brand-name">MUSEUM<br>OF YOU</span></a><nav><a href="#" class="active">Your museum</a><button class="small" data-new>+ New exhibition</button></nav></header>
<main id="main"></main><div id="toast" role="status"></div>
<dialog id="editor"><form id="form"><div class="modal-top"><span class="eyebrow">A NEW CHAPTER</span><button type="button" class="icon" id="close" aria-label="Close editor">×</button></div><h2 id="editor-heading">What do you want<br>to keep?</h2><label class="field">Exhibition name<input id="title" maxlength="100" placeholder="e.g. My first apartment"></label><label class="field">A little introduction <span>(optional)</span><textarea id="intro" maxlength="500" rows="2" placeholder="A few words about this chapter…"></textarea></label><div class="section-line"><h3>Your objects</h3><span id="count">0 / 3 to get started</span></div><p class="hint">A photo, a screenshot, a voice note. Three is a lovely place to start.</p><div id="objects"></div><label class="upload" id="upload-label"><input id="upload" type="file" multiple accept="image/*,audio/*"><span>＋</span> Add an object<small>Images or audio · up to 20 MB each</small></label><p id="error" role="alert"></p><footer class="modal-footer"><span>◌ Only on this browser</span><button type="submit">Save exhibition <span>↗</span></button></footer></form></dialog>
<script src="app.js"></script><script src="motion.js"></script></body></html>
